name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use the format vMAJOR.MINOR.PATCH; received '$tag'."
          }

          [xml] $project = Get-Content .\src\SnipAgent.App\SnipAgent.App.csproj
          $projectVersion = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          $tagVersion = $Matches.version
          if ($projectVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

          "VERSION=$projectVersion" >> $env:GITHUB_ENV
          "ARCHIVE=SnipAgent-$projectVersion-win-x64.zip" >> $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish .\src\SnipAgent.App\SnipAgent.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output .\Out\win-x64

      - name: Create release archive and checksum
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\Out\win-x64\* `
            -DestinationPath ".\Out\$env:ARCHIVE"

          $hash = (Get-FileHash ".\Out\$env:ARCHIVE" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ARCHIVE" |
            Set-Content .\Out\SHA256SUMS.txt -Encoding ascii

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\Out\$env:ARCHIVE" `
            ".\Out\SHA256SUMS.txt" `
            --verify-tag `
            --title "SnipAgent $env:VERSION" `
            --generate-notes
